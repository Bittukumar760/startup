<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-label="Fully furnished room after AI staging">
  <defs>
    <linearGradient id="wallA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f1ff"/>
      <stop offset="1" stop-color="#e9e6fb"/>
    </linearGradient>
    <linearGradient id="floorA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d3a06a"/>
      <stop offset="1" stop-color="#c08c52"/>
    </linearGradient>
    <linearGradient id="lightA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7e6"/>
      <stop offset="1" stop-color="#fff7e6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- wall -->
  <rect width="900" height="600" fill="url(#wallA)"/>
  <!-- floor -->
  <polygon points="0,440 900,440 900,600 0,600" fill="url(#floorA)"/>
  <!-- floor planks -->
  <g stroke="#b07d44" stroke-width="2" opacity="0.5">
    <line x1="0" y1="478" x2="900" y2="478"/>
    <line x1="0" y1="520" x2="900" y2="520"/>
    <line x1="0" y1="562" x2="900" y2="562"/>
  </g>
  <rect x="0" y="430" width="900" height="12" fill="#a9c4b0"/>
  <!-- bright window with daylight -->
  <rect x="560" y="120" width="240" height="200" rx="6" fill="#cfeaff" stroke="#8fb7d6" stroke-width="6"/>
  <line x1="680" y1="120" x2="680" y2="320" stroke="#8fb7d6" stroke-width="6"/>
  <line x1="560" y1="220" x2="800" y2="220" stroke="#8fb7d6" stroke-width="6"/>
  <polygon points="560,320 800,320 740,440 500,440" fill="url(#lightA)"/>
  <!-- wall art -->
  <rect x="150" y="150" width="120" height="90" rx="6" fill="#fff" stroke="#cdbdf0" stroke-width="6"/>
  <path d="M165 215 L200 175 L225 205 L250 180 L255 215 Z" fill="#8b5cf6" opacity="0.7"/>
  <circle cx="180" cy="172" r="8" fill="#f5b54c"/>
  <!-- rug -->
  <ellipse cx="420" cy="520" rx="300" ry="48" fill="#b9a6ec" opacity="0.55"/>
  <!-- sofa -->
  <g>
    <rect x="220" y="360" width="300" height="90" rx="18" fill="#6d5dd3"/>
    <rect x="232" y="330" width="276" height="60" rx="16" fill="#7e6fe0"/>
    <rect x="240" y="345" width="80" height="55" rx="12" fill="#9a8dee"/>
    <rect x="420" y="345" width="80" height="55" rx="12" fill="#9a8dee"/>
    <rect x="206" y="370" width="30" height="80" rx="12" fill="#5d4ec2"/>
    <rect x="504" y="370" width="30" height="80" rx="12" fill="#5d4ec2"/>
  </g>
  <!-- coffee table -->
  <rect x="300" y="470" width="150" height="22" rx="8" fill="#8a5a30"/>
  <rect x="312" y="492" width="10" height="34" fill="#7a4f2a"/>
  <rect x="428" y="492" width="10" height="34" fill="#7a4f2a"/>
  <!-- plant -->
  <rect x="700" y="400" width="44" height="50" rx="6" fill="#c98b54"/>
  <path d="M722 400 C700 350 690 330 715 300 C720 340 735 360 722 400 Z" fill="#4caf7d"/>
  <path d="M722 400 C745 355 760 340 740 305 C732 345 715 365 722 400 Z" fill="#3f9d6e"/>
  <!-- floor lamp -->
  <line x1="120" y1="300" x2="120" y2="450" stroke="#8a5a30" stroke-width="6"/>
  <path d="M95 300 L145 300 L132 255 L108 255 Z" fill="#f5d98a"/>
</svg>
