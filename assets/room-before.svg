<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-label="Empty, dated room before staging">
  <defs>
    <linearGradient id="wallB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d7dbe3"/>
      <stop offset="1" stop-color="#c5cad4"/>
    </linearGradient>
    <linearGradient id="floorB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3bcb1"/>
      <stop offset="1" stop-color="#b3ab9f"/>
    </linearGradient>
  </defs>
  <!-- wall -->
  <rect width="900" height="600" fill="url(#wallB)"/>
  <!-- floor -->
  <polygon points="0,440 900,440 900,600 0,600" fill="url(#floorB)"/>
  <!-- skirting -->
  <rect x="0" y="430" width="900" height="12" fill="#aeb4be"/>
  <!-- window -->
  <rect x="560" y="120" width="240" height="200" rx="6" fill="#eef1f6" stroke="#9aa1ad" stroke-width="6"/>
  <line x1="680" y1="120" x2="680" y2="320" stroke="#9aa1ad" stroke-width="6"/>
  <line x1="560" y1="220" x2="800" y2="220" stroke="#9aa1ad" stroke-width="6"/>
  <!-- dangling bulb -->
  <line x1="220" y1="60" x2="220" y2="150" stroke="#8b919c" stroke-width="3"/>
  <circle cx="220" cy="162" r="14" fill="#cfd4db" stroke="#9aa1ad" stroke-width="3"/>
  <!-- wall stain / dated patch -->
  <ellipse cx="170" cy="330" rx="60" ry="40" fill="#bfc4cd" opacity="0.6"/>
  <!-- power socket -->
  <rect x="430" y="400" width="22" height="22" rx="3" fill="#b7bcc6"/>
</svg>
